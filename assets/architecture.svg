<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Shortlist architecture diagram">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f7689"/>
    </marker>
  </defs>

  <rect width="1160" height="560" fill="url(#abg)"/>

  <!-- Browser -->
  <rect x="80" y="34" width="1000" height="96" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="104" y="70" font-size="22" fill="#f6efe0">Browser</text>
  <text x="104" y="92" font-size="13" fill="#8aa0b4">Next.js 16 · Tailwind · shadcn</text>
  <rect x="470" y="52" width="230" height="30" rx="15" fill="#123a30" stroke="#1b9c85"/>
  <text x="585" y="72" font-size="13" fill="#a9bccc" text-anchor="middle">paste résumés</text>
  <rect x="720" y="52" width="330" height="30" rx="15" fill="#123a30" stroke="#1b9c85"/>
  <text x="885" y="72" font-size="13" fill="#a9bccc" text-anchor="middle">upload PDFs → pdf.js (in-browser)</text>

  <!-- edges from Browser -->
  <path d="M300,130 L300,182" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M860,130 L860,182" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Server Actions -->
  <rect x="140" y="184" width="320" height="66" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="164" y="214" font-size="18" fill="#f6efe0">Server Actions</text>
  <text x="164" y="235" font-size="12.5" fill="#8aa0b4">create role · add candidates</text>

  <!-- /api/agent -->
  <rect x="700" y="184" width="320" height="66" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="724" y="214" font-size="18" fill="#f6efe0">/api/agent</text>
  <text x="724" y="235" font-size="12.5" fill="#8aa0b4">SSE stream · tool activity</text>

  <path d="M300,250 L300,300" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M860,250 L860,290" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Supabase -->
  <rect x="140" y="302" width="320" height="96" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="164" y="336" font-size="18" fill="#f6efe0">Supabase</text>
  <text x="164" y="358" font-size="12.5" fill="#8aa0b4">Postgres — persistence</text>
  <text x="164" y="380" font-size="12.5" fill="#a9bccc">roles · candidates · messages</text>

  <!-- deepagents graph -->
  <rect x="600" y="292" width="480" height="180" rx="14" fill="#0b1c2b" stroke="#e9c46a" stroke-opacity="0.45"/>
  <text x="624" y="320" font-size="18" fill="#f6efe0">deepagents graph</text>

  <rect x="622" y="336" width="200" height="112" rx="10" fill="#0f2233" stroke="#22485e"/>
  <text x="642" y="366" font-size="15" fill="#f6efe0">supervisor</text>
  <text x="642" y="388" font-size="11.5" fill="#8aa0b4">build rubric</text>
  <text x="642" y="406" font-size="11.5" fill="#8aa0b4">rank pipeline</text>
  <text x="642" y="424" font-size="11.5" fill="#8aa0b4">outreach · rejections</text>

  <rect x="842" y="336" width="216" height="112" rx="10" fill="#0f2233" stroke="#22485e"/>
  <text x="862" y="366" font-size="15" fill="#f6efe0">screener × N</text>
  <text x="862" y="388" font-size="11.5" fill="#8aa0b4">one subagent per</text>
  <text x="862" y="406" font-size="11.5" fill="#8aa0b4">candidate · evidence-</text>
  <text x="862" y="424" font-size="11.5" fill="#8aa0b4">scored against rubric</text>

  <path d="M722,336 L722,470 L800,470" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="700" y="500" width="280" height="46" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="724" y="528" font-size="15" fill="#f6efe0">Gemini (free) · or OpenRouter</text>
  <path d="M840,472 L840,500" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tools <-> Supabase (dashed) -->
  <path d="M600,382 L462,382" fill="none" stroke="#e9c46a" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.8" marker-end="url(#arrow)"/>
  <text x="470" y="374" font-size="11.5" fill="#e9c46a" opacity="0.85">tools read / write</text>
</svg>
