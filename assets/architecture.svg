<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" role="img" aria-label="Shortlist architecture diagram">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f7689"/>
    </marker>
    <style>
      .lbl  { font-family: Georgia,'Times New Roman',serif; fill:#f6efe0; }
      .sub  { font-family: Georgia,serif; fill:#8aa0b4; }
      .tag  { font-family: Georgia,serif; fill:#a9bccc; }
      .card { fill:#0f2233; stroke:#22485e; }
      .edge { stroke:#5f7689; stroke-width:2; fill:none; }
      .dash { stroke:#e9c46a; stroke-width:1.6; stroke-dasharray:5 5; fill:none; opacity:.8; }
    </style>
  </defs>

  <rect width="1160" height="560" fill="url(#abg)"/>

  <!-- Browser -->
  <rect class="card" x="80" y="34" width="1000" height="96" rx="12"/>
  <text class="lbl" x="104" y="70" font-size="22">Browser</text>
  <text class="sub" x="104" y="92" font-size="13">Next.js 16 · Tailwind · shadcn</text>
  <rect x="470" y="52" width="230" height="30" rx="15" fill="#123a30" stroke="#1b9c85"/>
  <text class="tag" x="585" y="72" font-size="13" text-anchor="middle">paste résumés</text>
  <rect x="720" y="52" width="330" height="30" rx="15" fill="#123a30" stroke="#1b9c85"/>
  <text class="tag" x="885" y="72" font-size="13" text-anchor="middle">upload PDFs → pdf.js (in-browser)</text>

  <!-- edges from Browser -->
  <path class="edge" d="M300,130 L300,182" marker-end="url(#arrow)"/>
  <path class="edge" d="M860,130 L860,182" marker-end="url(#arrow)"/>

  <!-- Server Actions -->
  <rect class="card" x="140" y="184" width="320" height="66" rx="12"/>
  <text class="lbl" x="164" y="214" font-size="18">Server Actions</text>
  <text class="sub" x="164" y="235" font-size="12.5">create role · add candidates</text>

  <!-- /api/agent -->
  <rect class="card" x="700" y="184" width="320" height="66" rx="12"/>
  <text class="lbl" x="724" y="214" font-size="18">/api/agent</text>
  <text class="sub" x="724" y="235" font-size="12.5">SSE stream · tool activity</text>

  <path class="edge" d="M300,250 L300,300" marker-end="url(#arrow)"/>
  <path class="edge" d="M860,250 L860,290" marker-end="url(#arrow)"/>

  <!-- Supabase -->
  <rect class="card" x="140" y="302" width="320" height="96" rx="12"/>
  <text class="lbl" x="164" y="336" font-size="18">Supabase</text>
  <text class="sub" x="164" y="358" font-size="12.5">Postgres — persistence</text>
  <text class="tag" x="164" y="380" font-size="12.5">roles · candidates · messages</text>

  <!-- deepagents graph -->
  <rect x="600" y="292" width="480" height="180" rx="14" fill="#0b1c2b" stroke="#e9c46a" stroke-opacity=".45"/>
  <text class="lbl" x="624" y="320" font-size="18">deepagents graph</text>

  <rect class="card" x="622" y="336" width="200" height="112" rx="10"/>
  <text class="lbl" x="642" y="366" font-size="15">supervisor</text>
  <text class="sub" x="642" y="388" font-size="11.5">build rubric</text>
  <text class="sub" x="642" y="406" font-size="11.5">rank pipeline</text>
  <text class="sub" x="642" y="424" font-size="11.5">outreach · rejections</text>

  <rect class="card" x="842" y="336" width="216" height="112" rx="10"/>
  <text class="lbl" x="862" y="366" font-size="15">screener × N</text>
  <text class="sub" x="862" y="388" font-size="11.5">one subagent per</text>
  <text class="sub" x="862" y="406" font-size="11.5">candidate · evidence-</text>
  <text class="sub" x="862" y="424" font-size="11.5">scored against rubric</text>

  <path class="edge" d="M722,336 L722,470 L800,470" marker-end="url(#arrow)" opacity=".9"/>

  <!-- LLM -->
  <rect class="card" x="700" y="500" width="280" height="46" rx="12"/>
  <text class="lbl" x="724" y="528" font-size="15">Gemini (free) · or OpenRouter</text>
  <path class="edge" d="M840,472 L840,500" marker-end="url(#arrow)"/>

  <!-- tools ↔ Supabase (dashed) -->
  <path class="dash" d="M600,382 L462,382" marker-end="url(#arrow)"/>
  <text class="tag" x="470" y="374" font-size="11.5" fill="#e9c46a" opacity=".85">tools read / write</text>
</svg>
