<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Shortlist deep-agent harness diagram">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <marker id="harrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f7689"/>
    </marker>
    <marker id="hgold" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e9c46a"/>
    </marker>
  </defs>

  <rect width="1200" height="670" fill="url(#hbg)"/>

  <!-- Recruiter -->
  <rect x="100" y="40" width="360" height="74" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="124" y="74" font-size="19" fill="#f6efe0">Recruiter</text>
  <text x="124" y="97" font-size="12.5" fill="#8aa0b4">chat — plain-language requests, streamed answers</text>
  <path d="M280,114 L280,190" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#harrow)"/>
  <text x="292" y="150" font-size="11.5" fill="#8aa0b4">asks · hears back (SSE)</text>

  <!-- deepagents graph container -->
  <rect x="70" y="140" width="1060" height="346" rx="16" fill="#0b1c2b" stroke="#e9c46a" stroke-opacity="0.45"/>
  <text x="1116" y="166" font-size="13" fill="#e9c46a" fill-opacity="0.8" text-anchor="end">LangGraph deepagents graph</text>

  <!-- Supervisor -->
  <rect x="100" y="190" width="500" height="230" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="124" y="226" font-size="19" fill="#f6efe0">Supervisor</text>
  <text x="124" y="248" font-size="12.5" fill="#8aa0b4">plans · talks to the recruiter · delegates</text>
  <text x="124" y="280" font-size="12.5" fill="#a9bccc">▸ builds the rubric from the JD — before any résumé</text>
  <text x="124" y="302" font-size="12.5" fill="#a9bccc">▸ ranks the pipeline</text>
  <text x="124" y="324" font-size="12.5" fill="#a9bccc">▸ drafts outreach &amp; rejections</text>
  <rect x="118" y="342" width="464" height="62" rx="8" fill="#0d2130" stroke="#22485e"/>
  <text x="134" y="362" font-size="10.5" fill="#e9c46a" letter-spacing="1.5">TOOLS</text>
  <text x="134" y="381" font-size="11.5" fill="#a9bccc" font-family="ui-monospace, 'SF Mono', Menlo, monospace">get_role · save_rubric · list_candidates</text>
  <text x="134" y="398" font-size="11.5" fill="#a9bccc" font-family="ui-monospace, 'SF Mono', Menlo, monospace">read_candidate · save_outreach · save_rejection</text>

  <!-- Screener subagent -->
  <rect x="660" y="190" width="440" height="230" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="684" y="226" font-size="19" fill="#f6efe0">Screener subagent <tspan fill="#e9c46a">× N</tspan></text>
  <text x="684" y="248" font-size="12.5" fill="#8aa0b4">one delegation per candidate</text>
  <text x="684" y="280" font-size="12.5" fill="#a9bccc">▸ reads the rubric + one résumé</text>
  <text x="684" y="302" font-size="12.5" fill="#a9bccc">▸ scores against the rubric, with evidence</text>
  <text x="684" y="324" font-size="12.5" fill="#a9bccc">▸ writes the profile + scorecard</text>
  <rect x="678" y="342" width="404" height="62" rx="8" fill="#0d2130" stroke="#22485e"/>
  <text x="694" y="362" font-size="10.5" fill="#e9c46a" letter-spacing="1.5">TOOLS <tspan fill="#8aa0b4" letter-spacing="0"> — deliberately narrow</tspan></text>
  <text x="694" y="386" font-size="11.5" fill="#a9bccc" font-family="ui-monospace, 'SF Mono', Menlo, monospace">get_rubric · read_candidate · save_screening</text>

  <!-- delegation arrows -->
  <path d="M600,248 L660,248" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#harrow)"/>
  <text x="630" y="240" font-size="11" fill="#8aa0b4" text-anchor="middle">task</text>
  <path d="M660,300 L600,300" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#harrow)"/>
  <text x="630" y="318" font-size="11" fill="#8aa0b4" text-anchor="middle">result</text>

  <!-- guardrails strip -->
  <text x="600" y="452" font-size="11.5" fill="#e9c46a" fill-opacity="0.85" text-anchor="middle">guardrails — tools closed over the role · save_screening refuses a partial scorecard · candidate resolved by name or id</text>

  <!-- Supabase -->
  <rect x="70" y="520" width="500" height="118" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="94" y="556" font-size="18" fill="#f6efe0">Supabase</text>
  <text x="94" y="578" font-size="12.5" fill="#8aa0b4">Postgres — persistence</text>
  <text x="94" y="600" font-size="12.5" fill="#a9bccc">roles · candidates · messages</text>
  <path d="M300,486 L300,520" fill="none" stroke="#e9c46a" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.85" marker-end="url(#hgold)"/>
  <text x="312" y="508" font-size="11" fill="#e9c46a" opacity="0.85">tools read / write</text>

  <!-- Kimi -->
  <rect x="630" y="520" width="500" height="118" rx="12" fill="#0f2233" stroke="#22485e"/>
  <text x="654" y="556" font-size="18" fill="#f6efe0">Kimi (Moonshot)</text>
  <text x="654" y="578" font-size="12.5" fill="#8aa0b4">kimi-k2.6 · one throttled model, shared by both</text>
  <text x="654" y="600" font-size="12.5" fill="#a9bccc">AGENT_PROVIDER → OpenRouter / Gemini fallback</text>
  <path d="M880,486 L880,520" fill="none" stroke="#5f7689" stroke-width="2" marker-end="url(#harrow)"/>
  <text x="892" y="508" font-size="11" fill="#8aa0b4">the graph runs on one model</text>
</svg>
